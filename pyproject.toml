[project]
name = "codebase-rag-mcp"
version = "0.1.0"
description = "MCP server that exposes local-codebase-rag retrieval as a search_codebase tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cody Chang" }]
# Only the MCP SDK. The HTTP client is the standard library (ADR 0002), so
# `uvx` / `pipx` can start the server without pulling in an HTTP stack.
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
codebase-rag-mcp = "codebase_rag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_rag_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
