name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --python ${{ matrix.python }}
      # No backend needed: MCP via in-memory Client, HTTP via a local http.server.
      - run: uv run pytest -q
      # The stdio entry point starts and answers initialize + tools/list.
      - run: uv run python scripts/stdio_smoke.py
